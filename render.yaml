services:
  - type: web
    runtime: node
    name: app
    # ALWAYS-ON — required. The discord.js gateway (bot.js) runs inside this web
    # process; a sleep-eligible plan would drop the websocket on idle spin-down and
    # kill every interaction until cold start. Do NOT downgrade below starter while
    # the bot owns interactions (WB-1 / Option C).
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
