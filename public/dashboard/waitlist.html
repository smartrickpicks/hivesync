<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hivesync — Waitlist</title>
    <link rel="stylesheet" href="/otto-brand.css">
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=__GA4_MEASUREMENT_ID__"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '__GA4_MEASUREMENT_ID__');
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Layout */
        .layout { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 220px; flex-shrink: 0;
            background: var(--raised); border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            padding: 24px 0; position: sticky; top: 0; height: 100vh;
            overflow-y: auto;
        }

        .sidebar-logo {
            display: flex; align-items: center; gap: 10px;
            padding: 0 20px 24px; border-bottom: 1px solid var(--border); margin-bottom: 16px;
        }
        .sidebar-logo-mark { font-family: var(--font-sans); font-size: 20px; font-weight: 800; color: var(--otto); }
        .sidebar-logo-word { display: block; font-family: var(--font-sans); font-size: 14px; font-weight: 700; color: var(--text); }
        .sidebar-logo-caption { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }

        .sidebar-nav { display: flex; flex-direction: column; padding: 0 12px; gap: 2px; }

        .sidebar-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 500; color: var(--text2);
            text-decoration: none; cursor: pointer;
            transition: var(--ease-default);
            border-left: 2px solid transparent;
        }
        .sidebar-item:hover { color: var(--text); background: rgba(124,92,252,0.06); }
        .sidebar-item.active {
            color: var(--text); border-left-color: var(--otto);
            background: rgba(124,92,252,0.08);
        }
        .sidebar-item-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

        .sidebar-section-label {
            font-family: var(--font-mono); font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; color: var(--text3);
            padding: 16px 24px 8px;
        }
        .sidebar-fn { opacity: 0.5; pointer-events: none; }

        /* Main content */
        .main-content { flex: 1; min-width: 0; padding: 32px 24px; }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .page-header h1 { font-size: 1.8rem; color: var(--text); }

        .page-header .subtitle {
            color: var(--text3);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* Section Card */
        .section-card {
            background: var(--raised); border: 1px solid var(--border);
            border-radius: var(--radius-md); overflow: hidden;
            transition: var(--ease-default);
        }
        .section-card:hover { border-color: rgba(124,92,252,0.3); box-shadow: 0 0 20px rgba(124,92,252,0.05); }

        .section-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-header h3 { font-size: 1rem; color: var(--text); }

        .filter-row { display: flex; gap: 8px; }

        .filter-btn {
            font-family: var(--font-sans); font-weight: 600; font-size: 12px;
            padding: 8px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); cursor: pointer;
            transition: var(--ease-default);
            background: transparent; color: var(--text2);
        }
        .filter-btn:hover { color: var(--text); border-color: rgba(124,92,252,0.4); background: rgba(124,92,252,0.06); }
        .filter-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .action-btn {
            font-family: var(--font-sans); font-weight: 600; font-size: 12px;
            padding: 8px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); cursor: pointer;
            transition: var(--ease-default);
            background: transparent; color: var(--text2);
            text-decoration: none; display: inline-flex; align-items: center;
        }
        .action-btn:hover { border-color: var(--otto); color: var(--otto); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        /* Waitlist table */
        .waitlist-table { width: 100%; border-collapse: collapse; }

        .waitlist-table th {
            text-align: left; font-size: 0.75rem;
            color: var(--text3); text-transform: uppercase;
            letter-spacing: 0.06em; font-family: var(--font-mono);
            padding: 12px 16px; border-bottom: 1px solid var(--border);
        }

        .waitlist-table td {
            padding: 14px 16px; font-size: 0.88rem;
            color: var(--text2); border-bottom: 1px solid var(--border);
        }

        .waitlist-table tr:hover td { background: rgba(124,92,252,0.03); }
        .waitlist-table .email-col { color: var(--text); font-weight: 500; }

        /* Empty state */
        .empty-state { padding: 60px 24px; text-align: center; }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 16px; }
        .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
        .empty-state p { color: var(--text3); font-size: 0.9rem; max-width: 320px; margin: 0 auto; }

        /* Loading */
        .loading {
            display: flex; align-items: center; justify-content: center;
            padding: 40px; color: var(--text3); gap: 10px;
        }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid var(--border); border-top-color: var(--otto);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Stat display block in page header */
        .wl-stat-value {
            font-family: var(--font-sans);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
        }
        .wl-stat-sub { font-size: 0.8rem; color: var(--text3); }

        /* Responsive */
        @media (max-width: 900px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; padding: 12px 16px; }
        }

        @media (max-width: 600px) {
            .main-content { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <!-- Logo lockup -->
            <div class="sidebar-logo">
                <span class="sidebar-logo-mark">O</span>
                <div>
                    <span class="sidebar-logo-word">Otto</span>
                    <span class="sidebar-logo-caption">Command Center</span>
                </div>
            </div>
            <!-- Primary tabs as sidebar nav items -->
            <nav class="sidebar-nav">
                <a class="sidebar-item" id="nav-messages" href="/dashboard">
                    <span class="sidebar-item-dot" style="background:var(--otto)"></span>Messages
                </a>
                <a class="sidebar-item active" id="nav-waitlist" href="/dashboard/waitlist">
                    <span class="sidebar-item-dot" style="background:var(--ship)"></span>Waitlist
                </a>
            </nav>
            <!-- Five-function nav items (decorative, chamber-colored) -->
            <div class="sidebar-section-label">Functions</div>
            <nav class="sidebar-nav">
                <a class="sidebar-item sidebar-fn" href="#"><span class="sidebar-item-dot" style="background:var(--discover)"></span>Scout</a>
                <a class="sidebar-item sidebar-fn" href="#"><span class="sidebar-item-dot" style="background:var(--build)"></span>Forge</a>
                <a class="sidebar-item sidebar-fn" href="#"><span class="sidebar-item-dot" style="background:var(--review)"></span>Sentinel</a>
                <a class="sidebar-item sidebar-fn" href="#"><span class="sidebar-item-dot" style="background:var(--ship)"></span>Relay</a>
                <a class="sidebar-item sidebar-fn" href="#"><span class="sidebar-item-dot" style="background:var(--otto)"></span>Pulse</a>
            </nav>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>Waitlist</h1>
                    <p class="subtitle">All signups, in reverse chronological order.</p>
                    <div class="wl-stat-sub" style="margin-top:8px;">
                        <span class="wl-stat-value" id="wl-total-count">—</span>
                        <span class="wl-stat-sub">total signups</span>
                    </div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-header">
                    <h3>All Waitlist Signups</h3>
                    <div class="filter-row">
                        <button class="filter-btn" id="wl-export-csv" disabled>Export CSV</button>
                        <a class="action-btn" id="wl-send-mailto" href="#" role="button">Send announcement</a>
                    </div>
                </div>
                <div style="overflow-x:auto;">
                    <table class="waitlist-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Email</th>
                                <th>Signup Date</th>
                                <th>Source</th>
                            </tr>
                        </thead>
                        <tbody id="waitlist-tbody">
                            <tr><td colspan="4" style="text-align:center;padding:40px;">
                                <div class="loading"><div class="spinner"></div> Loading...</div>
                            </td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <footer style="padding: 24px 0; border-top: 1px solid var(--border); margin-top: 32px;">
                <span class="otto-sig">built by otto · 2026-07-06</span>
            </footer>
        </main>
    </div>

    <script>
        const API_BASE = '';
        window.__wlSignups = [];

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function timeAgo(dateStr) {
            if (!dateStr) return '';
            const now = new Date();
            const date = new Date(dateStr);
            const diff = Math.floor((now - date) / 1000);

            if (diff < 60) return 'just now';
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
            return date.toLocaleDateString();
        }

        function pad2(n) { return n < 10 ? '0' + n : '' + n; }

        function todayYmd() {
            const d = new Date();
            return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
        }

        function csvEscape(v) {
            if (v === null || v === undefined) return '';
            const s = String(v);
            if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
            return s;
        }

        function renderRows(signups, total) {
            const tbody = document.getElementById('waitlist-tbody');
            if (!signups || signups.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="4">
                        <div class="empty-state">
                            <div class="icon">&#x1F4EC;</div>
                            <h3>No signups yet</h3>
                            <p>Share your landing page to start collecting waitlist signups.</p>
                        </div>
                    </td></tr>
                `;
                return;
            }
            tbody.innerHTML = signups.map((s, i) => {
                const num = total - i;
                const created = s.created_at || '';
                return '<tr>' +
                    '<td style="color:var(--text3);font-family:var(--font-mono);font-size:0.8rem;">' + num + '</td>' +
                    '<td class="email-col">' + escapeHtml(s.email) + '</td>' +
                    '<td title="' + escapeHtml(created) + '" style="font-size:0.82rem;color:var(--text3);">' + timeAgo(created) + '</td>' +
                    '<td>' + (s.referral_source ? escapeHtml(s.referral_source) : '<span style="color:var(--text3);">—</span>') + '</td>' +
                    '</tr>';
            }).join('');
        }

        function buildExportHref(signups) {
            const BOM = '﻿';
            const header = 'email,signup_date,source';
            const rows = signups.map(s => [
                csvEscape(s.email),
                csvEscape(s.created_at || ''),
                csvEscape(s.referral_source || '')
            ].join(','));
            const csv = BOM + header + '\n' + rows.join('\n') + '\n';
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            return {
                url: URL.createObjectURL(blob),
                filename: 'waitlist-' + todayYmd() + '.csv'
            };
        }

        function downloadCsv() {
            if (!window.__wlSignups.length) return;
            const file = buildExportHref(window.__wlSignups);
            const a = document.createElement('a');
            a.href = file.url;
            a.download = file.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(file.url), 1000);
        }

        function buildMailto(signups) {
            const subject = 'Hivesync waitlist update';
            const body = 'Hi everyone,\n\nThanks for signing up for the Hivesync waitlist. Wanted to share an update with you.\n\n— The Hivesync team';
            const bccAll = signups.map(s => s.email).filter(Boolean).join(',');
            // Most mail clients cap mailto length ~1800 chars; truncate the bcc list to stay under that.
            const MAX_LEN = 1800;
            let bcc = bccAll;
            if (bcc.length > MAX_LEN) {
                const emails = bcc.split(',');
                let acc = '';
                for (const e of emails) {
                    if ((acc + (acc ? ',' : '') + e).length > MAX_LEN) break;
                    acc = acc ? acc + ',' + e : e;
                }
                bcc = acc;
            }
            return 'mailto:?bcc=' + encodeURIComponent(bcc)
                + '&subject=' + encodeURIComponent(subject)
                + '&body=' + encodeURIComponent(body);
        }

        async function loadWaitlist() {
            try {
                const res = await fetch(API_BASE + '/api/waitlist?limit=500');
                const data = await res.json();
                if (!data.success) return;

                const total = data.total || (data.signups ? data.signups.length : 0);
                window.__wlSignups = data.signups || [];

                document.getElementById('wl-total-count').textContent = total;

                renderRows(window.__wlSignups, total);

                const exportBtn = document.getElementById('wl-export-csv');
                const mailtoBtn = document.getElementById('wl-send-mailto');

                if (window.__wlSignups.length === 0) {
                    exportBtn.disabled = true;
                    mailtoBtn.setAttribute('aria-disabled', 'true');
                    mailtoBtn.removeAttribute('href');
                } else {
                    exportBtn.disabled = false;
                    mailtoBtn.href = buildMailto(window.__wlSignups);
                }
            } catch (err) {
                console.error('Failed to load waitlist:', err);
                const tbody = document.getElementById('waitlist-tbody');
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--discover);">Failed to load waitlist. Check the server.</td></tr>';
            }
        }

        document.getElementById('wl-export-csv').addEventListener('click', downloadCsv);

        // Init
        loadWaitlist();
    </script>
</body>
</html>
